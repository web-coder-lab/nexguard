name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify, hash, and rename
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$APK" "NEXGUARD-${VERSION}.apk"
          sha256sum "NEXGUARD-${VERSION}.apk" | tee "NEXGUARD-${VERSION}.apk.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "NEXGUARD-${VERSION}.apk" | tee cert.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ github.ref_name == 'v1.0.3' }}
          make_latest: ${{ github.ref_name == 'v1.0.3' && 'false' || 'true' }}
          files: |
            NEXGUARD-*.apk
            NEXGUARD-*.apk.sha256
          body_path: cert.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
